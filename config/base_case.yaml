# Base case: generic North Sea platform near Tampen, supplied by offshore wind
# plus a small gas turbine.
#
# Every parameter is written as {value, unit, source}. Code reads `value` and
# works in SI units internally (W, kg, s, Sm3). `source` must cite where the
# number came from, or say plainly that it is an assumption to be replaced.

site:
  name: Generic North Sea platform (Tampen area)
  latitude:
    value: 61.0
    unit: deg N
    source: Project scope (docs/project_brief.md); ERA5 grid point near Tampen. To be moved to Snorre.
  longitude:
    value: 2.0
    unit: deg E
    source: Project scope (docs/project_brief.md); ERA5 grid point near Tampen. To be moved to Snorre.

era5:
  year:
    value: 2023
    unit: "-"
    source: Most recent complete, non-leap year (8760 h). Change for inter-annual sensitivity.
  dataset:
    value: reanalysis-era5-single-levels
    unit: "-"
    source: "Hersbach et al. (2023), ERA5 hourly data on single levels from 1940 to present. Copernicus C3S CDS. doi:10.24381/cds.adbb2d47"
  variables:
    value: [100m_u_component_of_wind, 100m_v_component_of_wind, 10m_u_component_of_wind, 10m_v_component_of_wind]
    unit: m/s
    source: ERA5 single-level variable names (CDS). 10 m components are only used by the 'era5_profile' shear method.
  raw_dir:
    value: data/raw/era5
    unit: path
    source: Repo convention.

wind_turbine:
  name: IEA-15-240-RWT
  power_curve_file:
    value: data/reference/IEA-15-240-RWT_power_curve.csv
    unit: "m/s, MW"
    source: "Gaertner et al. (2020), Definition of the IEA 15-MW Offshore Reference Wind Turbine, NREL/TP-5000-75698. Data from github.com/IEAWindTask37/IEA-15-240-RWT."
  rated_power:
    value: 15.0e+6
    unit: W
    source: Gaertner et al. (2020), Table 1.
  hub_height:
    value: 150.0
    unit: m
    source: Gaertner et al. (2020), Table 1.
  cut_in_speed:
    value: 3.0
    unit: m/s
    source: Gaertner et al. (2020), Table 1.
  cut_out_speed:
    value: 25.0
    unit: m/s
    source: Gaertner et al. (2020), Table 1.

wind_shear:
  # How to move ERA5 100 m wind up to hub height.
  #   power_law    : U_hub = U_100 * (z_hub / 100)^alpha, with fixed alpha below
  #   era5_profile : alpha computed every hour from ERA5 10 m and 100 m winds
  method:
    value: power_law
    unit: "-"
    source: Modelling choice; see README 'Wind module'.
  alpha:
    value: 0.14
    unit: "-"
    source: "IEC 61400-3-1:2019, normal wind profile for offshore sites (power-law exponent 0.14)."
  alpha_bounds:
    value: [0.0, 0.4]
    unit: "-"
    source: Assumption. Clips hourly alpha in 'era5_profile' mode to avoid unphysical extrapolation in very stable or unstable hours.
  reference_height:
    value: 100.0
    unit: m
    source: ERA5 100 m wind level.

wind_farm:
  n_turbines:
    value: 4
    unit: "-"
    source: "PLACEHOLDER (60 MW). To be sized against the platform demand from process.py, and varied in the sensitivity study. For scale: Hywind Tampen is 11 x 8.6 MW = 88 MW for Snorre + Gullfaks."
  wake_loss:
    value: 0.05
    unit: fraction
    source: ASSUMPTION, typical for a small (few-turbine) farm. Replace with a cited value or a wake model.
  electrical_loss:
    value: 0.02
    unit: fraction
    source: ASSUMPTION, array cable + export cable to platform. Replace with a cited value.
  availability:
    value: 0.95
    unit: fraction
    source: ASSUMPTION, typical offshore wind technical availability. Replace with a cited value.

fuel_gas:
  # LHV, standard volume and CO2 per Sm3 are all computed from this composition
  # (ISO 6976 via NeqSim, carbon balance), so they stay consistent with each other.
  composition:
    value: {nitrogen: 0.01, CO2: 0.02, methane: 0.80, ethane: 0.09, propane: 0.05, i-butane: 0.01, n-butane: 0.015, n-pentane: 0.005}
    unit: mole fraction
    source: PLACEHOLDER, generic North Sea associated gas. Replace with Snorre fuel gas composition, or tune so the CO2 factor matches the one in the Snorre annual emissions report.
  reference_temperature:
    value: 288.15
    unit: K
    source: Standard conditions for Sm3 (15 degC, 101.325 kPa), ISO 13443.
  reference_pressure:
    value: 101325.0
    unit: Pa
    source: Standard conditions for Sm3 (15 degC, 101.325 kPa), ISO 13443.
  reported_co2_factor_range:
    value: [2.34, 2.69]
    unit: kg CO2/Sm3
    source: "Used only as a sanity check. 2.34 = historical NCS average quoted in SFT reporting guidance, part B (2001), https://www.offshorenorge.no/contentassets/2384ff4e883441afba593ca26570b3e7/utslippsrapportering---del-b.pdf. 2.67 = Edvard Grieg 2024 emissions report (Aker BP), https://akerbp.com/wp-content/uploads/2025/12/edvard-grieg-2024.pdf. 2.69 = Yme 2024 annual report to the Norwegian Environment Agency, https://www.offshorenorge.no/contentassets/39dda802fe004804bdfd32121e6a7c4b/yme-2024.pdf."

gas_turbines:
  # Fuel model (linear "Willans line"): fuel = a * F_rated * on + (1 - a) * F_rated * P / P_rated,
  # with F_rated = P_rated / design_efficiency and a = no_load_fuel_fraction.
  part_load_curve_file:
    value: data/reference/gt_part_load_indicative.csv
    unit: "-, -"
    source: SimTurbo blog curve (low reliability), see file header. Replace with an OEM or peer-reviewed curve.
  large:
    name: Large aeroderivative (Case 1)
    rated_power:
      value: 30.0e+6
      unit: W
      source: PLACEHOLDER, typical ~30 MW class aeroderivative (e.g. LM2500+ class). Replace with the Snorre turbine rating if found.
    design_efficiency:
      value: 0.36
      unit: fraction (LHV basis)
      source: PLACEHOLDER, simple-cycle efficiency at rated load incl. offshore installation losses. Replace with OEM datasheet value minus installation losses.
    no_load_fuel_fraction:
      value: 0.21
      unit: fraction of rated fuel
      source: Fitted to the part-load curve in part_load_curve_file (fit within 1 % from 20 to 100 % load). Refit when that curve is replaced.
    min_load_fraction:
      value: 0.30
      unit: fraction of rated power
      source: PLACEHOLDER, minimum stable load. DLE units are often limited higher for NOx. Replace with a cited value.
    max_ramp_fraction_per_hour:
      value: 1.0
      unit: fraction of rated power per h
      source: ASSUMPTION, aeroderivatives change load within minutes, so ramping does not limit hourly dispatch.
  small:
    name: Small industrial turbine (Cases 2-4)
    rated_power:
      value: 13.0e+6
      unit: W
      source: PLACEHOLDER, typical ~13 MW class industrial turbine (e.g. SGT-400 class). Size to be set after the demand map.
    design_efficiency:
      value: 0.34
      unit: fraction (LHV basis)
      source: PLACEHOLDER, see large turbine.
    no_load_fuel_fraction:
      value: 0.21
      unit: fraction of rated fuel
      source: Same fitted value as the large turbine (no separate curve available).
    min_load_fraction:
      value: 0.30
      unit: fraction of rated power
      source: PLACEHOLDER, see large turbine.
    max_ramp_fraction_per_hour:
      value: 1.0
      unit: fraction of rated power per h
      source: ASSUMPTION, see large turbine.

outputs:
  processed_dir:
    value: data/processed
    unit: path
    source: Repo convention.
  figure_dir:
    value: results/figures
    unit: path
    source: Repo convention.
